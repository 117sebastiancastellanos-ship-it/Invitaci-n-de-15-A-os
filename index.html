<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación XV Años</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Georgia', serif; background-color: #fdfaf6; display: flex; justify-content: center; align-items: center; text-align: center; }
        #pantalla-inicio { position: fixed; width: 100%; height: 100%; background: white; z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.5s; }
        .boton-entrar { padding: 18px 45px; font-size: 20px; background: #d4af37; color: white; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        #contenido { display: none; padding: 20px; animation: aparecer 2s ease forwards; }
        @keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="pantalla-inicio">
        <p style="margin-bottom: 20px; color: #888;">Bienvenido a una noche mágica</p>
        <button class="boton-entrar" id="btnComenzar">✨ Abrir Invitación ✨</button>
    </div>

    <div id="contenido">
        <h1 style="color: #d4af37;">Mis 15 Años</h1>
        <p>Te espero para compartir un momento inolvidable.</p>
        <p><i>Lindsey Stirling - Carol of the Bells</i></p>
    </div>

    <audio id="reproductor" loop playsinline>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <script>
        const btn = document.getElementById('btnComenzar');
        const audio = document.getElementById('reproductor');

        btn.addEventListener('click', function() {
            // Reproducir el archivo local musica.mp3
            audio.play().then(() => {
                // Si funciona, mostramos la invitación
                document.getElementById('pantalla-inicio').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('pantalla-inicio').style.display = 'none';
                    document.getElementById('contenido').style.display = 'block';
                }, 500);
            }).catch(err => {
                alert("No se pudo cargar el archivo 'musica.mp3'. Asegúrate de que esté en la misma carpeta que este HTML.");
                console.error(err);
            });
        });
    </script>
</body>
</html>
